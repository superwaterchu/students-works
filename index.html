<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>從零開始 AI 寫程式｜誇誇群作品牆</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18212f;
      --muted: #667085;
      --line: #d9e0ea;
      --paper: #ffffff;
      --panel: #ffffff;
      --accent: #15a87a;
      --accent-2: #2d6cdf;
      --warm: #f0b84f;
      --shadow: 0 16px 45px rgba(24, 33, 47, .13);
      --radius: 8px;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
    }

    button {
      font: inherit;
    }

    .app-shell {
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid rgba(24, 33, 47, .12);
      background: rgba(245, 245, 245, 0.94);
      backdrop-filter: blur(16px);
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      max-width: 1220px;
      margin: 0 auto;
      padding: 9px 14px;
    }

    .brand {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 8px;
    }

    .brand > div:last-child {
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid rgba(24, 33, 47, .16);
      border-radius: 8px;
      background: #fff;
      color: var(--accent);
      font-size: 17px;
      font-weight: 900;
      box-shadow: none;
    }

    h1 {
      margin: 0;
      overflow: hidden;
      font-size: 15px;
      line-height: 1.2;
      letter-spacing: 0;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .topbar-actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 8px;
    }

    .sort-toggle {
      display: inline-flex;
      width: 31px;
      min-height: 31px;
      justify-content: center;
      align-items: center;
      padding: 6px;
      border: 1px solid rgba(41, 41, 41, 0.12);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .62);
      color: var(--ink);
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
    }

    .sort-toggle:hover {
      border-color: rgba(21, 168, 122, .38);
      background: #fff;
    }

    .sort-toggle-mark {
      color: var(--accent);
      font-size: 13px;
      line-height: 1;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      line-height: 1.55;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
    }

    .stat {
      flex: 0 0 auto;
      min-width: auto;
      padding: 6px 8px;
      border: 1px solid rgba(24, 33, 47, .12);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .62);
    }

    .stat strong,
    .stat span {
      display: block;
    }

    .stat strong {
      font-size: 16px;
      line-height: 1;
    }

    .stat span {
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
    }

    main {
      max-width: 1220px;
      margin: 0 auto;
      padding: 28px 18px 46px;
    }

    .masonry {
      column-count: 4;
      column-gap: 16px;
      animation: viewIn .45s ease both;
    }

    @keyframes viewIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .shot {
      position: relative;
      display: block;
      width: 100%;
      margin: 0 0 16px;
      overflow: hidden;
      border: 1px solid rgba(24, 33, 47, .1);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 0 12px 30px rgba(24, 33, 47, .09);
      break-inside: avoid;
      cursor: zoom-in;
      transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    }

    .shot:hover {
      transform: translateY(-3px);
      border-color: rgba(21, 168, 122, .45);
      box-shadow: var(--shadow);
    }

    .shot img {
      display: block;
      width: 100%;
      height: auto;
      background: #edf1f6;
    }

    .shot figcaption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(30, 30, 30, 0.84);
    }

    .lightbox.is-open {
      display: flex;
    }

    .lightbox-panel {
      position: relative;
      display: grid;
      width: min(100%, 1060px);
      max-height: calc(100vh - 40px);
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
      border-radius: var(--radius);
      background: #181818;
      box-shadow: 0 26px 70px rgba(0, 0, 0, .45);
    }

    .lightbox-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      color: #fff;
    }

    .lightbox-heading {
      min-width: 0;
    }

    .lightbox-heading strong {
      display: block;
    }

    .lightbox-actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 8px;
    }

    .lightbox-bar button {
      width: 38px;
      height: 38px;
      border: 1px solid rgba(255, 255, 255, .26);
      border-radius: 8px;
      background: transparent;
      color: #fff;
      cursor: pointer;
      font-size: 22px;
      line-height: 1;
    }

    .lightbox-bar button:hover {
      border-color: rgba(255, 255, 255, .5);
      background: rgba(255, 255, 255, .1);
    }

    .lightbox-viewport {
      overflow: auto;
      background: #202020;
      cursor: default;
      overscroll-behavior: contain;
      touch-action: none;
    }

    .lightbox-viewport.is-zoomed {
      cursor: grab;
    }

    .lightbox-viewport.is-dragging {
      cursor: grabbing;
      user-select: none;
    }

    .lightbox img {
      display: block;
      width: 100%;
      max-width: none;
      margin: 0 auto;
      max-height: calc(100vh - 98px);
      object-fit: contain;
      background: #202020;
      pointer-events: none;
      transform-origin: center top;
      user-select: none;
    }

    .lightbox-viewport.is-zoomed img {
      max-height: none;
    }

    @media (max-width: 980px) {
      .masonry {
        column-count: 3;
      }
    }

    @media (max-width: 760px) {
      .topbar-inner {
        align-items: center;
      }

      h1 {
        font-size: 14px;
      }

      .brand p {
        white-space: normal;
      }

      .stat {
        min-width: auto;
      }

      .stat span {
        display: none;
      }

      .masonry {
        column-count: 2;
        column-gap: 12px;
      }

      .shot {
        margin-bottom: 12px;
      }

      .shot figcaption {
        padding: 9px 10px;
      }

    }

    @media (max-width: 430px) {
      .topbar-inner,
      main {
        padding-right: 12px;
        padding-left: 12px;
      }

      .masonry {
        column-count: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-mark">🎨</div>
          <div>
            <h1>從零開始 AI 寫程式｜誇誇群作品牆</h1>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="sort-toggle" type="button" id="sort-toggle" aria-label="切換為倒序排列" aria-pressed="false">
            <span class="sort-toggle-mark" aria-hidden="true">↑</span>
          </button>
          <div class="stat" aria-label="作品數量"><strong id="count">0</strong><span>作品分享</span></div>
        </div>
      </div>
    </header>

    <main>
      <section aria-label="瀑布流靈感牆">
        <div class="masonry" id="masonry-grid"></div>
      </section>
    </main>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="作品預覽">
    <div class="lightbox-panel">
      <div class="lightbox-bar">
        <div class="lightbox-heading">
          <strong id="lightbox-title">作品截圖</strong>
        </div>
        <div class="lightbox-actions" aria-label="縮放工具">
          <button type="button" id="zoom-toggle" aria-label="放大到滿版">＋</button>
          <button type="button" id="lightbox-close" aria-label="關閉預覽">×</button>
        </div>
      </div>
      <div class="lightbox-viewport" id="lightbox-viewport">
        <img id="lightbox-img" alt="">
      </div>
    </div>
  </div>

  <script>
    const masonryGrid = document.querySelector("#masonry-grid");
    const lightbox = document.querySelector("#lightbox");
    const lightboxViewport = document.querySelector("#lightbox-viewport");
    const lightboxImg = document.querySelector("#lightbox-img");
    const lightboxTitle = document.querySelector("#lightbox-title");
    const zoomToggle = document.querySelector("#zoom-toggle");
    const sortToggle = document.querySelector("#sort-toggle");
    const sortMark = sortToggle.querySelector(".sort-toggle-mark");
    const count = document.querySelector("#count");
    let works = [];
    let isReversed = false;
    let isFullSize = false;
    let dragStart = null;

    function source(work) {
      return work.image;
    }

    function label(work, index) {
      return work.title || `作品 ${String(index + 1).padStart(2, "0")}`;
    }

    function setFullSize(nextIsFullSize) {
      const previousIsFullSize = isFullSize;
      isFullSize = nextIsFullSize;
      lightboxViewport.classList.toggle("is-zoomed", isFullSize);
      zoomToggle.textContent = isFullSize ? "−" : "＋";
      zoomToggle.setAttribute("aria-label", isFullSize ? "縮小回 100%" : "放大到滿版");

      if (!isFullSize) {
        lightboxViewport.scrollTo({ top: 0, left: 0 });
      } else if (!previousIsFullSize) {
        lightboxViewport.scrollTo({ top: 0, left: 0 });
      }
    }

    function resetViewMode() {
      setFullSize(false);
    }

    function toggleFullSize() {
      setFullSize(!isFullSize);
    }

    function openLightbox(work, index) {
      lightboxImg.src = source(work);
      lightboxImg.alt = label(work, index);
      lightboxTitle.textContent = label(work, index);
      lightbox.dataset.sourceFile = work.image;
      lightbox.classList.add("is-open");
      resetViewMode();
      document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
      lightbox.classList.remove("is-open");
      lightboxImg.removeAttribute("src");
      resetViewMode();
      document.body.style.overflow = "";
    }

    function makeFigure(work, index) {
      const figure = document.createElement("figure");
      figure.className = "shot";
      figure.tabIndex = 0;
      figure.innerHTML = `
        <img loading="lazy" src="${source(work)}" alt="${label(work, index)}">
        <figcaption>
          <span>${label(work, index)}</span>
        </figcaption>
      `;
      figure.addEventListener("click", () => openLightbox(work, index));
      figure.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openLightbox(work, index);
        }
      });
      return figure;
    }

    function renderWorks() {
      const orderedWorks = isReversed ? [...works].reverse() : works;
      masonryGrid.replaceChildren();
      orderedWorks.forEach((work) => {
        const originalIndex = works.indexOf(work);
        masonryGrid.append(makeFigure(work, originalIndex));
      });
    }

    async function loadWorks() {
      try {
        const response = await fetch("data/works.json");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        works = await response.json();
        count.textContent = works.length;
        renderWorks();
      } catch (error) {
        masonryGrid.textContent = "作品資料讀取失敗，請確認 data/works.json 是否存在，並使用本機伺服器開啟頁面。";
        console.error(error);
      }
    }

    function updateSortToggle() {
      sortToggle.setAttribute("aria-pressed", String(isReversed));
      sortToggle.setAttribute("aria-label", isReversed ? "切換為正序排列" : "切換為倒序排列");
      sortMark.textContent = isReversed ? "↓" : "↑";
    }

    sortToggle.addEventListener("click", () => {
      isReversed = !isReversed;
      updateSortToggle();
      renderWorks();
    });

    loadWorks();

    document.querySelector("#lightbox-close").addEventListener("click", closeLightbox);
    zoomToggle.addEventListener("click", toggleFullSize);
    lightboxViewport.addEventListener("wheel", (event) => {
      if (!lightbox.classList.contains("is-open")) return;
      event.preventDefault();
      setFullSize(event.deltaY < 0);
    }, { passive: false });
    lightboxViewport.addEventListener("pointerdown", (event) => {
      if (!isFullSize) return;
      event.preventDefault();
      dragStart = {
        x: event.clientX,
        y: event.clientY,
        left: lightboxViewport.scrollLeft,
        top: lightboxViewport.scrollTop
      };
      lightboxViewport.classList.add("is-dragging");
      lightboxViewport.setPointerCapture(event.pointerId);
    });
    lightboxViewport.addEventListener("pointermove", (event) => {
      if (!dragStart) return;
      event.preventDefault();
      lightboxViewport.scrollLeft = dragStart.left - (event.clientX - dragStart.x);
      lightboxViewport.scrollTop = dragStart.top - (event.clientY - dragStart.y);
    });
    lightboxViewport.addEventListener("pointerup", (event) => {
      dragStart = null;
      lightboxViewport.classList.remove("is-dragging");
      if (lightboxViewport.hasPointerCapture(event.pointerId)) {
        lightboxViewport.releasePointerCapture(event.pointerId);
      }
    });
    lightboxViewport.addEventListener("pointercancel", (event) => {
      dragStart = null;
      lightboxViewport.classList.remove("is-dragging");
      if (lightboxViewport.hasPointerCapture(event.pointerId)) {
        lightboxViewport.releasePointerCapture(event.pointerId);
      }
    });
    lightbox.addEventListener("click", (event) => {
      if (event.target === lightbox) closeLightbox();
    });
    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeLightbox();
      if (!lightbox.classList.contains("is-open")) return;
      if (event.key === "+" || event.key === "=") setFullSize(true);
      if (event.key === "-" || event.key === "0") resetViewMode();
    });
  </script>
</body>
</html>
